name: qa

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_candidates.py
      - name: Audit complete OCR source coverage
        run: python scripts/audit_source_coverage.py --output /tmp/source_coverage.json
      - name: Build appendix structural-review inventory
        run: |
          python scripts/build_appendix_review_inventory.py \
            --output /tmp/appendix_review_inventory.json \
            --report /tmp/appendix_review_inventory_report.json
      - run: python scripts/build_reconciliation_queue.py --output /tmp/review_queue.csv
      - run: python scripts/summarize_reconciliation_queue.py --input /tmp/review_queue.csv --output /tmp/reconciliation_queue_summary.json
      - run: python scripts/build_inferred_review_batch.py --json-output /tmp/inferred_review_batch.json --markdown-output /tmp/inferred_review_batch.md
      - run: python scripts/validate_reconciliation_decisions.py
      - run: python scripts/summarize_reconciliation_status.py --output /tmp/reconciliation_status.json
      - name: Verify reconciliation queue completeness
        run: |
          python - <<'PY'
          import csv

          def count(path, encoding):
              with open(path, encoding=encoding, newline='') as handle:
                  return sum(1 for _ in csv.DictReader(handle))

          candidates = count('data/lexicon/candidates.csv', 'utf-8-sig')
          queue = count('/tmp/review_queue.csv', 'utf-8')
          assert candidates == queue, (candidates, queue)
          assert queue > 0
          print(f'reconciliation queue covers {queue} candidates')
          PY
      - name: Upload phase-2 review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase2-reconciliation-review
          path: |
            /tmp/source_coverage.json
            /tmp/appendix_review_inventory.json
            /tmp/appendix_review_inventory_report.json
            /tmp/review_queue.csv
            /tmp/reconciliation_queue_summary.json
            /tmp/inferred_review_batch.json
            /tmp/inferred_review_batch.md
            /tmp/reconciliation_status.json
          if-no-files-found: error
          retention-days: 30
