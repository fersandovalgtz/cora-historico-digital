name: qa

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/validate_candidates.py
