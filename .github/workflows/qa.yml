name: qa

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_candidates.py
      - name: Audit complete OCR source coverage
        run: python scripts/audit_source_coverage.py --output /tmp/source_coverage.json
      - name: Build appendix machine inventory
        run: python scripts/build_appendix_machine_inventory.py --output /tmp/appendix_machine_inventory.json --report /tmp/appendix_machine_inventory_report.json
      - name: Build structured numeral machine lexicon
        run: python scripts/build_numeral_machine_lexicon.py --jsonl /tmp/numerals_machine.jsonl --csv /tmp/numerals_machine.csv --report /tmp/numerals_machine_report.json
      - name: Verify numeral machine invariants
        run: |
          python - <<'PY'
          import csv, json
          with open('/tmp/numerals_machine.jsonl', encoding='utf-8') as handle:
              records = [json.loads(line) for line in handle if line.strip()]
          with open('/tmp/numerals_machine_report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          assert len(records) == report['explicit_pair_total'] > 0
          assert [r['order'] for r in records] == list(range(1, len(records) + 1))
          assert len({r['numeral_id'] for r in records}) == len(records)
          assert all(r['human_verified'] is False for r in records)
          assert all(r['authority_status'] == 'machine_derived' for r in records)
          assert all(r['record_status'] == 'machine_extracted_explicit_pair' for r in records)
          print(f"numeral layer contains {len(records)} explicit pairs across {report['series_counts']}")
          PY
      - name: Build irregular verbs and particles machine structure
        run: python scripts/build_irregular_particles_machine.py --jsonl /tmp/irregular_particles_machine.jsonl --csv /tmp/irregular_particles_machine.csv --report /tmp/irregular_particles_machine_report.json
      - name: Verify irregular/particle machine invariants
        run: |
          python - <<'PY'
          import json
          with open('/tmp/irregular_particles_machine.jsonl', encoding='utf-8') as handle:
              records = [json.loads(line) for line in handle if line.strip()]
          with open('/tmp/irregular_particles_machine_report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          assert len(records) == report['record_total'] == report['source_nonempty_paragraph_total'] > 0
          assert [r['order'] for r in records] == list(range(1, len(records) + 1))
          assert [r['source_unit_id'] for r in records] == [f"ORT1888-irrunit-{i:03d}" for i in range(1, len(records) + 1)]
          assert len({r['irregular_id'] for r in records}) == len(records)
          assert all(r['human_verified'] is False for r in records)
          assert all(r['authority_status'] == 'machine_derived' for r in records)
          assert all(r['record_status'] == 'machine_structured_appendix_unit' for r in records)
          required_types = {'imperative_example', 'expression_example', 'particle_description', 'explanatory_prose', 'ocr_noise'}
          assert required_types.issubset({r['record_type'] for r in records})
          print(f"irregular/particle layer contains {len(records)} units across {report['record_type_counts']}")
          PY
      - name: Build machine-only lexicon
        run: python scripts/build_machine_corpus.py --jsonl /tmp/machine_lexicon.jsonl --csv /tmp/machine_lexicon.csv --report /tmp/machine_resolution.json
      - name: Verify machine corpus coverage
        run: |
          python - <<'PY'
          import csv, json
          with open('data/lexicon/candidates.csv', encoding='utf-8-sig', newline='') as handle:
              candidates = list(csv.DictReader(handle))
          with open('/tmp/machine_lexicon.jsonl', encoding='utf-8') as handle:
              records = [json.loads(line) for line in handle if line.strip()]
          assert len(candidates) == len(records) > 0
          assert all(record['human_verified'] is False for record in records)
          assert all(record['authority_status'] == 'machine_derived' for record in records)
          print(f'machine layer covers all {len(records)} candidates')
          PY
      - name: Upload machine QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: machine-corpus-qa
          path: |
            /tmp/source_coverage.json
            /tmp/appendix_machine_inventory.json
            /tmp/appendix_machine_inventory_report.json
            /tmp/numerals_machine.jsonl
            /tmp/numerals_machine.csv
            /tmp/numerals_machine_report.json
            /tmp/irregular_particles_machine.jsonl
            /tmp/irregular_particles_machine.csv
            /tmp/irregular_particles_machine_report.json
            /tmp/machine_lexicon.jsonl
            /tmp/machine_lexicon.csv
            /tmp/machine_resolution.json
          if-no-files-found: error
          retention-days: 30
