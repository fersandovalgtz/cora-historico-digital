name: qa

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_candidates.py
      - name: Audit complete OCR source coverage
        run: python scripts/audit_source_coverage.py --output /tmp/source_coverage.json
      - name: Build appendix machine inventory
        run: python scripts/build_appendix_machine_inventory.py --output /tmp/appendix_machine_inventory.json --report /tmp/appendix_machine_inventory_report.json
      - name: Build structured numeral machine lexicon
        run: python scripts/build_numeral_machine_lexicon.py --jsonl /tmp/numerals_machine.jsonl --csv /tmp/numerals_machine.csv --report /tmp/numerals_machine_report.json
      - name: Verify numeral machine invariants
        run: |
          python - <<'PY'
          import json
          with open('/tmp/numerals_machine.jsonl', encoding='utf-8') as handle:
              records = [json.loads(line) for line in handle if line.strip()]
          with open('/tmp/numerals_machine_report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          assert len(records) == report['explicit_pair_total'] > 0
          assert [r['order'] for r in records] == list(range(1, len(records) + 1))
          assert len({r['numeral_id'] for r in records}) == len(records)
          assert all(r['human_verified'] is False for r in records)
          assert all(r['authority_status'] == 'machine_derived' for r in records)
          assert all(r['record_status'] == 'machine_extracted_explicit_pair' for r in records)
          print(f"numeral layer contains {len(records)} explicit pairs across {report['series_counts']}")
          PY
      - name: Build irregular verbs and particles machine structure
        run: python scripts/build_irregular_particles_machine.py --jsonl /tmp/irregular_particles_machine.jsonl --csv /tmp/irregular_particles_machine.csv --report /tmp/irregular_particles_machine_report.json
      - name: Verify irregular/particle machine invariants
        run: |
          python - <<'PY'
          import json
          with open('/tmp/irregular_particles_machine.jsonl', encoding='utf-8') as handle:
              records = [json.loads(line) for line in handle if line.strip()]
          with open('/tmp/irregular_particles_machine_report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          assert len(records) == report['record_total'] == report['source_nonempty_paragraph_total'] > 0
          assert [r['order'] for r in records] == list(range(1, len(records) + 1))
          assert [r['source_unit_id'] for r in records] == [f"ORT1888-irrunit-{i:03d}" for i in range(1, len(records) + 1)]
          assert len({r['irregular_id'] for r in records}) == len(records)
          assert all(r['human_verified'] is False for r in records)
          assert all(r['authority_status'] == 'machine_derived' for r in records)
          assert all(r['record_status'] == 'machine_structured_appendix_unit' for r in records)
          required_types = {'imperative_example', 'expression_example', 'particle_description', 'explanatory_prose', 'ocr_noise'}
          assert required_types.issubset({r['record_type'] for r in records})
          print(f"irregular/particle layer contains {len(records)} units across {report['record_type_counts']}")
          PY
      - name: Verify committed irregular/particle derivatives are reproducible
        run: |
          python - <<'PY'
          import csv
          import json

          def load_jsonl(path):
              with open(path, encoding='utf-8') as handle:
                  return [json.loads(line) for line in handle if line.strip()]

          def load_csv(path):
              with open(path, encoding='utf-8', newline='') as handle:
                  return list(csv.DictReader(handle))

          assert load_jsonl('/tmp/irregular_particles_machine.jsonl') == load_jsonl('data/appendices/irregular_particles_machine.jsonl')
          assert load_csv('/tmp/irregular_particles_machine.csv') == load_csv('data/appendices/irregular_particles_machine.csv')
          with open('/tmp/irregular_particles_machine_report.json', encoding='utf-8') as handle:
              generated_report = json.load(handle)
          with open('reports/irregular_particles_machine.json', encoding='utf-8') as handle:
              committed_report = json.load(handle)
          assert generated_report == committed_report
          print('committed irregular/particle derivatives are semantically reproducible')
          PY
      - name: Build machine-only lexicon
        run: python scripts/build_machine_corpus.py --jsonl /tmp/machine_lexicon.jsonl --csv /tmp/machine_lexicon.csv --report /tmp/machine_resolution.json
      - name: Verify machine corpus coverage
        run: |
          python - <<'PY'
          import csv, json
          with open('data/lexicon/candidates.csv', encoding='utf-8-sig', newline='') as handle:
              candidates = list(csv.DictReader(handle))
          with open('/tmp/machine_lexicon.jsonl', encoding='utf-8') as handle:
              records = [json.loads(line) for line in handle if line.strip()]
          assert len(candidates) == len(records) > 0
          assert all(record['human_verified'] is False for record in records)
          assert all(record['authority_status'] == 'machine_derived' for record in records)
          print(f'machine layer covers all {len(records)} candidates')
          PY
      - name: Build TEI Lex-0 projection
        run: python scripts/build_tei_lex0.py --source /tmp/machine_lexicon.csv --output /tmp/ortega1888_tei_lex0.xml --report /tmp/tei_lex0_report.json
      - name: Verify TEI Lex-0 projection invariants
        run: |
          python - <<'PY'
          import csv
          import json
          import xml.etree.ElementTree as ET

          TEI = 'http://www.tei-c.org/ns/1.0'
          XML = 'http://www.w3.org/XML/1998/namespace'
          q = lambda name: f'{{{TEI}}}{name}'

          with open('/tmp/machine_lexicon.csv', encoding='utf-8-sig', newline='') as handle:
              source = list(csv.DictReader(handle))
          accepted = [r for r in source if r['machine_status'] == 'machine_accepted']
          residual = [r for r in source if r['machine_status'] != 'machine_accepted']
          source_by_article = {r['article_id']: r for r in accepted}

          root = ET.parse('/tmp/ortega1888_tei_lex0.xml').getroot()
          assert root.tag == q('TEI')
          assert root.attrib['type'] == 'lex-0'
          entries = root.findall(f".//{q('body')}/{q('entry')}")
          residual_items = root.findall(f".//{q('back')}//{q('item')}")
          assert len(entries) == len(accepted) == 2137
          assert len(residual_items) == len(residual) == 3
          assert {e.attrib[f'{{{XML}}}id'] for e in entries} == set(source_by_article)

          for entry in entries:
              article_id = entry.attrib[f'{{{XML}}}id']
              row = source_by_article[article_id]
              lemma = entry.find(f"./{q('form')}/{q('orth')}")
              cit = entry.find(f"./{q('sense')}/{q('cit')}[@type='translationEquivalent']")
              translated = cit.find(f"./{q('form')}/{q('orth')}")
              assert entry.attrib[f'{{{XML}}}lang'] == 'es'
              assert entry.attrib['type'] == 'mainEntry'
              assert entry.attrib['corresp'] == f"urn:chd:{row['candidate_id']}"
              assert lemma.text == row['headword_es_ocr']
              assert cit.attrib[f'{{{XML}}}lang'] == 'crn'
              assert translated.text == row['cora_ocr']

          with open('/tmp/tei_lex0_report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          assert report['source_record_total'] == len(source) == 2140
          assert report['entry_total'] == 2137
          assert report['residual_total'] == 3
          assert report['machine_status_counts'] == {
              'machine_accepted': 2137,
              'machine_rejected': 2,
              'machine_uncertain': 1,
          }
          assert report['object_language'] == 'es'
          assert report['target_language'] == 'crn'
          assert report['human_verified'] is False
          print('TEI Lex-0 projection preserves all accepted entries and all residual machine candidates')
          PY
      - name: Install Relax NG validator
        run: |
          sudo apt-get update
          sudo apt-get install -y jing
      - name: Fetch and verify archived TEI Lex-0 0.9.5 Relax NG schema
        run: |
          curl -fsSL --retry 3 --retry-delay 2 https://lex-0.org/releases/v0.9.5/schema/lex-0.rng -o /tmp/lex-0-v0.9.5.rng
          echo '35e73fef48526634714bdf3d16b924f958fca078a903d0bdc2dd4d7d116d1aaa  /tmp/lex-0-v0.9.5.rng' | sha256sum -c -
      - name: Validate projection against official TEI Lex-0 0.9.5 schema
        run: jing /tmp/lex-0-v0.9.5.rng /tmp/ortega1888_tei_lex0.xml
      - name: Upload machine QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: machine-corpus-qa
          path: |
            /tmp/source_coverage.json
            /tmp/appendix_machine_inventory.json
            /tmp/appendix_machine_inventory_report.json
            /tmp/numerals_machine.jsonl
            /tmp/numerals_machine.csv
            /tmp/numerals_machine_report.json
            /tmp/irregular_particles_machine.jsonl
            /tmp/irregular_particles_machine.csv
            /tmp/irregular_particles_machine_report.json
            /tmp/machine_lexicon.jsonl
            /tmp/machine_lexicon.csv
            /tmp/machine_resolution.json
            /tmp/ortega1888_tei_lex0.xml
            /tmp/tei_lex0_report.json
            /tmp/lex-0-v0.9.5.rng
          if-no-files-found: error
          retention-days: 30
