name: publish-v0.1.0

on:
  workflow_run:
    workflows: ["qa"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact QA-approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify final 0.1.0 metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          assert 'version: "0.1.0"' in citation
          assert 'date-released: "2026-09-11"' in citation

          codemeta = json.loads(Path('codemeta.json').read_text(encoding='utf-8'))
          assert codemeta['version'] == '0.1.0'

          committed = json.loads(Path('release/manifest.json').read_text(encoding='utf-8'))
          assert committed['target_version'] == '0.1.0'
          assert committed['release_status'] == 'candidate'
          print('final metadata and release candidate are consistent for 0.1.0')
          PY

      - name: Rebuild and verify release integrity artifacts
        run: |
          python scripts/build_release_manifest.py --output /tmp/manifest.json --sha256sums /tmp/SHA256SUMS
          python scripts/build_release_manifest.py --verify --output /tmp/manifest.json
          sha256sum -c /tmp/SHA256SUMS
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/manifest.json')
          manifest = json.loads(source.read_text(encoding='utf-8'))
          assert manifest['target_version'] == '0.1.0'
          assert manifest['release_status'] == 'candidate'
          manifest['release_status'] = 'released'
          Path('/tmp/manifest-v0.1.0.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Prepare release notes
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          # Cora Histórico Digital 0.1.0

          Primera versión citable del corpus e infraestructura reproducible machine-only.

          - 2,140 candidatos computacionales en la capa alfabética.
          - 2,137 entradas `machine_accepted`, 2 `machine_rejected` y 1 `machine_uncertain`.
          - Proyección TEI Lex-0 0.9.5 validada.
          - Proyección CLDF Dictionary validada.
          - Apéndices machine-only estructurados para numerales y verbos/partículas.
          - Trazabilidad, procedencia, pruebas reproducibles y checksums SHA-256.

          La release adjunta un manifiesto final de integridad (`release_status: released`) y `SHA256SUMS`. No se declara DOI hasta que un archivador externo lo emita realmente.
          EOF

      - name: Create GitHub Release v0.1.0 once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'GitHub Release v0.1.0 already exists; nothing to do.'
            exit 0
          fi
          gh release create v0.1.0 \
            /tmp/manifest-v0.1.0.json \
            /tmp/SHA256SUMS \
            --target "$RELEASE_SHA" \
            --title "Cora Histórico Digital 0.1.0" \
            --notes-file /tmp/release-notes.md
