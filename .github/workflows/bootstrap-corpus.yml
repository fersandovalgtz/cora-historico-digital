name: bootstrap-corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/bootstrap-corpus.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Rebuild corpus from Internet Archive witness
        run: python scripts/ingest_ortega1888.py
      - name: Validate candidates
        run: python scripts/validate_candidates.py
      - name: Audit complete OCR source coverage
        run: python scripts/audit_source_coverage.py
      - name: Build appendix machine inventory
        run: python scripts/build_appendix_machine_inventory.py
      - name: Build structured numeral machine lexicon
        run: python scripts/build_numeral_machine_lexicon.py
      - name: Build irregular verbs and particles machine structure
        run: python scripts/build_irregular_particles_machine.py
      - name: Build machine-only lexicon
        run: python scripts/build_machine_corpus.py
      - name: Remove downloaded source binaries before commit
        run: rm -rf data/source/original
      - name: Commit reproducible derived data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build Ortega 1888 machine corpus'
            git push
          fi

# Machine-only corpus pipeline; no human-review stage.
