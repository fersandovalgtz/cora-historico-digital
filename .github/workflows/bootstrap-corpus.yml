name: bootstrap-corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/bootstrap-corpus.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Rebuild corpus from Internet Archive witness
        run: python scripts/ingest_ortega1888.py
      - name: Validate candidates
        run: python scripts/validate_candidates.py
      - name: Build unresolved alignment review packet
        run: |
          python scripts/build_inferred_review_batch.py \
            --json-output artifacts/phase2_facsimile_review/inferred_review_batch.json \
            --markdown-output artifacts/phase2_facsimile_review/inferred_review_batch.md
      - name: Render locked facsimile evidence
        run: python scripts/render_inferred_facsimile.py --output-dir artifacts/phase2_facsimile_review
      - name: Upload phase-2 facsimile review packet
        uses: actions/upload-artifact@v4
        with:
          name: phase2-facsimile-review
          path: artifacts/phase2_facsimile_review
          if-no-files-found: error
          retention-days: 30
      - name: Remove downloaded source binaries before commit
        run: rm -rf data/source/original
      - name: Commit reproducible derived data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build initial Ortega 1888 corpus'
            git push
          fi

# Bootstrap pipeline initialized 2026-09-09.
