name: bootstrap-corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/bootstrap-corpus.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Rebuild corpus from Internet Archive witness
        run: python scripts/ingest_ortega1888.py
      - name: Validate candidates
        run: python scripts/validate_candidates.py
      - name: Audit complete OCR source coverage
        run: python scripts/audit_source_coverage.py
      - name: Build appendix machine inventory
        run: python scripts/build_appendix_machine_inventory.py
      - name: Build structured numeral machine lexicon
        run: python scripts/build_numeral_machine_lexicon.py
      - name: Build irregular verbs and particles machine structure
        run: python scripts/build_irregular_particles_machine.py
      - name: Build machine-only lexicon
        run: python scripts/build_machine_corpus.py
      - name: Build TEI Lex-0 projection
        run: python scripts/build_tei_lex0.py
      - name: Install Relax NG validator
        run: |
          sudo apt-get update
          sudo apt-get install -y jing
      - name: Fetch and verify archived TEI Lex-0 0.9.5 Relax NG schema
        run: |
          curl -fsSL --retry 3 --retry-delay 2 https://lex-0.org/releases/v0.9.5/schema/lex-0.rng -o /tmp/lex-0-v0.9.5.rng
          echo '35e73fef48526634714bdf3d16b924f958fca078a903d0bdc2dd4d7d116d1aaa  /tmp/lex-0-v0.9.5.rng' | sha256sum -c -
      - name: Validate TEI projection before commit
        run: jing /tmp/lex-0-v0.9.5.rng data/interoperability/ortega1888_tei_lex0.xml
      - name: Remove downloaded source binaries before commit
        run: rm -rf data/source/original
      - name: Commit reproducible derived data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build Ortega 1888 machine corpus and interoperable views'
            git push
          fi

# Machine-only corpus pipeline; no human-review stage.
